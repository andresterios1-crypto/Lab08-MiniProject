<!DOCTYPE html>
<html>
<head>
  <title>ACME University - Teacher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <div class="top-bar">
      <div class="who">
        <span id="welcome">Welcome!</span>
        <div id="loggedIn" class="logged-in"></div>
      </div>
      <h1>ACME University</h1>
      <a href="/logout">Sign out</a>
    </div>

    <!-- dark blue bar with the title (and the back arrow on the gradebook) -->
    <div class="title-bar">
      <button id="backButton" class="back" onclick="showCourses()">&#8592;</button>
      <span id="title">Your Courses</span>
    </div>

    <div class="panel">
      <div id="message" class="saved"></div>
      <div id="teacherTable"></div>
    </div>
  </div>

  <script src="teacher.js"></script>
</body>
</html>
